name: GoalTabs CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - name: Syntax-check backend JavaScript
        run: find . -type f -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  vercel-production:
    name: Deploy production to Vercel
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_NHjbgwh0pXVXKi1tF6S4v9ez
      VERCEL_PROJECT_ID: prj_LN7dYeJJ2rOjuLgpegnstlhmoMne
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest
      - name: Pull Vercel production environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy Vercel production artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Vercel token check
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not configured; Vercel deployment was skipped."
